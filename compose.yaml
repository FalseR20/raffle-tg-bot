name: raffle-tg-bot

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raffle}
      POSTGRES_USER: ${POSTGRES_USER:-raffle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raffle}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-raffle-minio}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-raffle-minio-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    ports:
      - "${RUSTFS_PORT:-9010}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9011}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-raffle}:${POSTGRES_PASSWORD:-raffle}@postgres:5432/${POSTGRES_DB:-raffle}
      RUSTFS_ENDPOINT: http://rustfs:9000
      TZ: ${TZ:-Europe/Minsk}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run python -m bot.main"]
    stop_grace_period: 30s

volumes:
  postgres-data:
  rustfs-data:

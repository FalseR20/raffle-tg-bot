[project]
name = "raffle-tg-bot"
version = "0.1.0"
description = "Telegram charity raffle bot (BYN) with manual receipt verification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aioboto3>=13.2.0",
    "aiogram>=3.15.0",
    "alembic>=1.14.0",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pypdf>=5.1.0",
    "reportlab>=4.2.5",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires real PostgreSQL (and optionally RustFS)",
]
filterwarnings = [
    "error::DeprecationWarning:bot.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["bot/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    "B008",   # FastAPI-style defaults are not used; aiogram filters use calls.
    "RUF001", # Cyrillic strings are intentional.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]
"bot/db/migrations/env.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

name: raffle-tg-bot

# Production stack. Unlike compose.yaml this file publishes no database, object
# storage or Telegram-facing ports: only the bot's health endpoint is exposed,
# and only on the loopback interface.
#
# Usage (on the server, from the repository root):
#   docker compose -f compose.prod.yaml --env-file .env up -d --build

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raffle}
      POSTGRES_USER: ${POSTGRES_USER:-raffle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "false"
    command: /data
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-raffle}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-raffle}
      RUSTFS_ENDPOINT: http://rustfs:9000
      TZ: ${TZ:-Europe/Minsk}
      HEALTH_PORT: ${HEALTH_PORT:-8081}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m bot.main"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${HEALTH_PORT:-8081}', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8081}:${HEALTH_PORT:-8081}"

volumes:
  postgres-data:
  rustfs-data:
